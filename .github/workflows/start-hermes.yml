name: Start Hermes stack in Codespace

on:
  workflow_dispatch:
    inputs:
      codespace:
        description: "Codespace name"
        required: false
        default: "bookish-yodel-9694qxprr6563x9vr"
      boot:
        description: "Start the codespace if it is stopped"
        required: false
        default: "true"

permissions:
  actions: read
  contents: read

jobs:
  start-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CS: ${{ inputs.codespace || 'bookish-yodel-9694qxprr6563x9vr' }}
      CODESPACE_NAME: ${{ inputs.codespace || 'bookish-yodel-9694qxprr6563x9vr' }}
      GH_TOKEN: ${{ secrets.CODESPA_PAT }}
    steps:
      - name: Start the codespace if stopped
        if: ${{ inputs.boot != 'false' }}
        run: |
          state=$(gh api "/user/codespaces/$CS" --jq '.state' || echo unknown)
          echo "state=$state"
          if [ "$state" = "Shutdown" ] || [ "$state" = "Stopped" ]; then
            gh api -X POST "/user/codespaces/$CS/start" >/dev/null && echo "start requested"
          fi

      - name: Wait for codespace to be running
        run: |
          for i in $(seq 1 40); do
            state=$(gh api "/user/codespaces/$CS" --jq '.state' || echo unknown)
            echo "attempt $i: state=$state"
            if [ "$state" = "Available" ] || [ "$state" = "Running" ]; then
              echo "codespace is up"
              exit 0
            fi
            sleep 15
          done
          echo "codespace did not become available in time"
          exit 1

      - name: Start freellmapi + Hermes gateway inside the codespace
        run: |
          gh codespace ssh -c "$CS" -- bash /workspaces/Jarvis/.devcontainer/start-hermes.sh || true
          sleep 45
          gh codespace ssh -c "$CS" -- bash -c 'curl -s -o /dev/null -w "flm3001:%{http_code}\n" http://127.0.0.1:3001/v1/models; curl -s -o /dev/null -w "gw8642:%{http_code}\n" http://127.0.0.1:8642/v1/health'

      - name: Forward the ports
        run: |
          gh codespace ports forward -c "$CS" 8642:8642 3001:3001 &
          sleep 20

      - name: Force port 8642 to public
        run: |
          gh codespace ports visibility 8642:public -c ${{ env.CODESPACE_NAME }}
          gh codespace ports visibility 3001:public -c ${{ env.CODESPACE_NAME }} || true

      - name: Verify port visibility
        run: |
          gh codespace ports -c "$CS" --json sourcePort,visibility,browseUrl || true
          curl -s -o /dev/null -w "public_health:%{http_code}\n" "https://$CS-8642.app.github.dev/v1/health" || true
